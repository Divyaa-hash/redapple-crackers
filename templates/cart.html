{% extends 'base.html' %}
{% load static %}

{% block title %}Shopping Cart - RedApple crackers Store{% endblock %}

{% block content %}
<style>
    /* Mobile cart responsiveness */
    .cart-item {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }
    
    @media (min-width: 640px) {
        .cart-item {
            flex-direction: row;
            align-items: center;
            gap: 1.5rem;
        }
    }
    
    .cart-item-image {
        width: 100%;
        max-width: 120px;
        height: 120px;
        margin: 0 auto;
        flex-shrink: 0;
    }
    
    @media (min-width: 640px) {
        .cart-item-image {
            width: 96px;
            height: 96px;
            margin: 0;
        }
    }
    
    .cart-item-details {
        text-align: center;
        flex: 1;
        min-width: 0;
    }
    
    @media (min-width: 640px) {
        .cart-item-details {
            text-align: left;
        }
    }
    
    .cart-item-actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
    }
    
    @media (min-width: 640px) {
        .cart-item-actions {
            flex-direction: row;
            align-items: center;
            gap: 1rem;
            padding-top: 0;
            border-top: none;
            width: auto;
        }
    }
    
    .quantity-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .quantity-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: none;
        color: white;
        font-size: 1.25rem;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    
    .quantity-btn:hover {
        background: #ef4444;
    }
    
    .quantity-value {
        min-width: 40px;
        text-align: center;
        font-size: 1rem;
        color: white;
    }
    
    .delete-btn {
        padding: 0.5rem;
        background: none;
        border: none;
        color: #9ca3af;
        cursor: pointer;
        transition: color 0.2s;
        flex-shrink: 0;
    }
    
    .delete-btn:hover {
        color: #ef4444;
    }
</style>

<!-- Cart Content -->
<section class="py-8 sm:py-12 bg-black-100">
    <div class="max-w-7xl mx-auto px-4">
        <div id="cart-content">
            <!-- Cart will be populated by JavaScript -->
        </div>
        <div id="empty-cart" class="text-center py-12 hidden">
            <h2 class="text-2xl font-bold text-white mb-4">Your cart is empty</h2>
            <p class="text-gray-400 mb-6">Add some items to get started!</p>
            <a href="/shop/" class="btn-gold inline-block px-6 py-3 rounded-lg">Continue Shopping</a>
        </div>
    </div>
</section>

<script>
// Load cart from localStorage
function loadCart() {
    const savedCart = localStorage.getItem('redappleCart');
    const cartContent = document.getElementById('cart-content');
    const emptyCart = document.getElementById('empty-cart');
    
    if (!savedCart || Object.keys(JSON.parse(savedCart)).length === 0) {
        cartContent.innerHTML = '';
        emptyCart.classList.remove('hidden');
        return;
    }
    
    const cart = JSON.parse(savedCart);
    let netTotal = 0;
    let originalTotal = 0;
    let totalItems = 0;
    
    let itemsHtml = '<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-8">';
    itemsHtml += '<div class="lg:col-span-2"><div class="glass-card p-4 sm:p-6 rounded-2xl">';
    
    for (const productId in cart) {
        const item = cart[productId];
        netTotal += item.quantity * item.discountedPrice;
        originalTotal += item.quantity * item.originalPrice;
        totalItems += item.quantity;
        
        itemsHtml += `
            <div class="cart-item py-4 sm:py-6 border-b border-white/10 last:border-0">
                <div class="cart-item-details flex-1">
                    <h3 class="font-semibold text-white text-base sm:text-lg">${item.productName}</h3>
                    <p class="text-red-500 font-bold text-lg sm:text-xl mt-1 sm:mt-2">₹${item.unitPrice.toFixed(0)}</p>
                </div>
                
                <div class="cart-item-actions">
                    <div class="quantity-controls">
                        <span class="quantity-value">Qty: ${item.quantity}</span>
                    </div>
                    
                    <button onclick="removeFromCart(${productId})" class="delete-btn" aria-label="Remove item">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        `;
    }
    
    itemsHtml += '</div></div>';
    
    // Cart Summary
    const youSave = originalTotal - netTotal;
    const shipping = 99;
    const gstAmount = netTotal * 0.18;
    const total = netTotal + shipping + gstAmount;
    
    itemsHtml += `
        <div class="lg:col-span-1">
            <div class="glass-card p-4 sm:p-6 rounded-2xl sticky top-24">
                <h2 class="text-xl sm:text-2xl font-bold text-white mb-4 sm:mb-6">Order Summary</h2>
                
                <div class="space-y-3 sm:space-y-4 mb-4 sm:mb-6">
                    <div class="flex justify-between text-gray-400 text-sm sm:text-base">
                        <span>Subtotal</span>
                        <span class="text-white">₹${netTotal.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between text-gray-400 text-sm sm:text-base">
                        <span>Shipping</span>
                        <span class="text-white">₹${shipping.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between text-gray-400 text-sm sm:text-base">
                        <span>GST (18%)</span>
                        <span class="text-white">₹${gstAmount.toFixed(2)}</span>
                    </div>
                    <hr class="border-white/10">
                    <div class="flex justify-between text-lg sm:text-xl font-bold">
                        <span class="text-white">Total</span>
                        <span class="text-red-500">₹${total.toFixed(2)}</span>
                    </div>
                </div>
                
                <a href="/shop/" class="btn-gold w-full text-center block py-3 sm:py-4 rounded-lg text-base sm:text-lg font-bold">Continue Shopping</a>
            </div>
        </div>
    `;
    
    itemsHtml += '</div>';
    
    cartContent.innerHTML = itemsHtml;
    emptyCart.classList.add('hidden');
    
    // Update navbar cart count
    const cartCountElements = document.querySelectorAll('.cart-count');
    cartCountElements.forEach(element => {
        element.textContent = totalItems;
    });
}

function removeFromCart(productId) {
    const savedCart = localStorage.getItem('redappleCart');
    if (savedCart) {
        const cart = JSON.parse(savedCart);
        delete cart[productId];
        localStorage.setItem('redappleCart', JSON.stringify(cart));
        loadCart();
        alert('Product removed from cart!');
    }
}

// Load cart on page load
window.onload = function() {
    loadCart();
};
</script>
{% endblock %}
