{% extends 'base.html' %}

{% block title %}Contact Us - Premium crackers Store{% endblock %}

{% block content %}
<!-- Contact Info -->
<section class="py-16 bg-black-100">
    <div class="max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 md:grid-cols-1 gap-8 max-w-xl mx-auto">
            <div class="glass-card p-6 text-center">
                <div class="w-16 h-16 bg-gold-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-gold-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                </div>
                <h3 class="font-semibold text-gray-200 mb-2">Phone</h3>
                <p class="text-gray-400 text-sm">9345980679</p>
            </div>
        </div>
    </div>
</section>

<!-- Contact Form -->
<section class="py-16 bg-black-200">
    <div class="max-w-3xl mx-auto px-4">
        <h2 class="text-3xl font-display font-bold text-gradient mb-8 text-center">Send us a Message</h2>
        
        <form class="glass-card p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-300 mb-2">Full Name *</label>
                    <input type="text" required class="input-premium" placeholder="Enter your name">
                </div>
                <div>
                    <label class="block text-gray-300 mb-2">Email Address *</label>
                    <input type="email" required class="input-premium" placeholder="Enter your email">
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-gray-300 mb-2">Phone Number</label>
                    <input type="tel" class="input-premium" placeholder="Enter your phone number">
                </div>
                <div>
                    <label class="block text-gray-300 mb-2">Subject *</label>
                    <select required class="input-premium">
                        <option value="">Select a topic</option>
                        <option>General Inquiry</option>
                        <option>Product Information</option>
                        <option>Order Status</option>
                        <option>Returns & Refunds</option>
                        <option>Wholesale Inquiry</option>
                        <option>Technical Support</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Order Number (if applicable)</label>
                <input type="text" class="input-premium" placeholder="Enter order number">
            </div>
            
            <div>
                <label class="block text-gray-300 mb-2">Message *</label>
                <textarea required class="input-premium" rows="6" placeholder="Describe your inquiry in detail"></textarea>
            </div>
            
            <button type="submit" class="btn-gold w-full">Send Message</button>
        </form>
    </div>
</section>
{% endblock %}
