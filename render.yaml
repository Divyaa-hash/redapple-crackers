services:
  - type: web
    name: redapple-crackers
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: True
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: DB_NAME
        fromDatabase:
          name: redapple-crackers-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: redapple-crackers-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: redapple-crackers-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: redapple-crackers-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: redapple-crackers-db
          property: port

databases:
  - name: redapple-crackers-db
    databaseName: redapple_crackers_db
    user: redapple_crackers_db_user
