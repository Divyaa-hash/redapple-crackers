services:
  - type: web
    name: redapple-crackers
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py sync_from_json && python manage.py collectstatic --noinput --clear
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://redapple-crackers.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        generateValue: false
        value: agkeucqd
      - key: CLOUDINARY_API_KEY
        generateValue: false
        value: 647136372246985
      - key: CLOUDINARY_API_SECRET
        generateValue: true

databases:
  - name: redapple-crackers-db
    databaseName: redapple_crackers_db
    user: redapple_crackers_db_user
